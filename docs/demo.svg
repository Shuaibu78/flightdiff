<text x="20" y="52" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" xml:space="preserve"><tspan fill="#7ee787">$ </tspan><tspan fill="#e6edf3">flightdiff info testdata/crash.ulg</tspan></text>
